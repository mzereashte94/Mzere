name: Premium Cloud Signer Engine (Ultra Fast)

on:
  repository_dispatch:
    types: [trigger-sign]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Fast Checkout
        uses: actions/checkout@v4

      - name: 🚀 Ultra Fast Production Sign
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          USE_FREE_CERT: ${{ github.event.client_payload.use_free_cert }}
          CERT_ID: ${{ github.event.client_payload.cert_id }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          P12_BASE64: ${{ github.event.client_payload.p12_base64 }}
          PROV_BASE64: ${{ github.event.client_payload.prov_base64 }}
          CUSTOM_PASSWORD: ${{ github.event.client_payload.password }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          set -e

          echo ">> Setting up OpenSSL..."
          cat << 'EOF' > /tmp/custom_openssl.cnf
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1
          EOF
          export OPENSSL_CONF=/tmp/custom_openssl.cnf
          
          LOWER_APP=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$LOWER_APP" == "ashtemobile" ]]; then IPA_NAME="AshteMobile.ipa"; REAL_NAME="AshteMobile"; ICON_NAME="Ashtemobile.jpeg";
          elif [[ "$LOWER_APP" == "esign" ]]; then IPA_NAME="Esign.ipa"; REAL_NAME="Esign"; ICON_NAME="Esign.jpeg";
          elif [[ "$LOWER_APP" == "ksign" ]]; then IPA_NAME="Ksign.ipa"; REAL_NAME="Ksign"; ICON_NAME="Ksign.jpeg";
          elif [[ "$LOWER_APP" == "mytv" ]]; then IPA_NAME="MyTV.ipa"; REAL_NAME="MyTV"; ICON_NAME="mytv.jpeg";
          elif [[ "$LOWER_APP" == "ipaomtk" ]]; then IPA_NAME="IPAOMTK.ipa"; REAL_NAME="IPAOMTK"; ICON_NAME="ipaomtk.jpeg";
          else IPA_NAME="AshteMobile.ipa"; REAL_NAME="AshteMobile"; ICON_NAME="Ashtemobile.jpeg"; fi

          if [[ "$USE_FREE_CERT" == "true" ]]; then
            CLEAN_CERT=$(echo "$CERT_ID" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
          else
            CLEAN_CERT="customvip"
          fi

          echo ">> Downloading zsign..."
          wget -qO- https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-linux-x86_64.tar.gz | tar -xz
          chmod +x zsign
          
          echo ">> Downloading base IPA: $IPA_NAME"
          gh release download V1 -p "$IPA_NAME" --repo mzereashte94/Mzere || { echo "❌ ERROR: Could not find $IPA_NAME in V1 release!"; exit 1; }
          mv "$IPA_NAME" raw_app.ipa
          
          echo ">> Preparing certificates..."
          if [[ "$USE_FREE_CERT" == "true" ]]; then
            cp "$GITHUB_WORKSPACE/cert/$CERT_ID/cert.p12" ./cert.p12 || { echo "❌ ERROR: cert.p12 missing for $CERT_ID"; exit 1; }
            cp "$GITHUB_WORKSPACE/cert/$CERT_ID/profile.mobileprovision" ./profile.mobileprovision || { echo "❌ ERROR: profile missing for $CERT_ID"; exit 1; }
            CERT_PASSWORD=$(cat "$GITHUB_WORKSPACE/cert/$CERT_ID/pass.txt" | tr -d '\n\r') || true
          else
            echo "$P12_BASE64" | tr -d ' \n\r' | base64 -d > cert.p12
            echo "$PROV_BASE64" | tr -d ' \n\r' | base64 -d > profile.mobileprovision
            CERT_PASSWORD=$(echo "$CUSTOM_PASSWORD" | tr -d '\n\r')
          fi

          echo ">> Unzipping IPA..."
          unzip -q raw_app.ipa
          APP_DIR=$(find Payload -maxdepth 1 -type d -name "*.app" | head -n 1)

          echo ">> Removing unnecessary plugins..."
          rm -rf "$APP_DIR/PlugIns" || true
          rm -rf "$APP_DIR/Extensions" || true
          rm -rf "$APP_DIR/Watch" || true

          cp "$GITHUB_WORKSPACE/icons/$ICON_NAME" "$APP_DIR/CustomIpaBlackIcon.png" || true

          NEW_BUNDLE_ID="com.ashtemobile.${CLEAN_CERT}.${BUILD_ID}"
          echo ">> Injecting Bundle ID: $NEW_BUNDLE_ID"
          
          python3 -c '
          import plistlib, sys
          plist_path = sys.argv[1]
          new_bundle = sys.argv[2]
          try:
              with open(plist_path, "rb") as f: pl = plistlib.load(f)
              pl["CFBundleIdentifier"] = new_bundle
              pl["CFBundleIcons"] = {"CFBundlePrimaryIcon": {"CFBundleIconFiles": ["CustomIpaBlackIcon"], "UIPrerenderedIcon": True}}
              if "CFBundleIcons~ipad" in pl: pl["CFBundleIcons~ipad"] = pl["CFBundleIcons"]
              with open(plist_path, "wb") as f: plistlib.dump(pl, f)
          except Exception as e:
              pass
          ' "$APP_DIR/Info.plist" "$NEW_BUNDLE_ID"

          rm raw_app.ipa
          zip -q0ur raw_app.ipa Payload

          FINAL_IPA_NAME="${REAL_NAME}_signed_${BUILD_ID}.ipa"
          
          echo ">> Signing IPA..."
          ./zsign -q -k cert.p12 -p "$CERT_PASSWORD" -m profile.mobileprovision -b "$NEW_BUNDLE_ID" -o "$FINAL_IPA_NAME" raw_app.ipa || { echo "❌ ERROR: zsign failed!"; exit 1; }

          echo ">> Deleting old signed assets..."
          OLD_ASSETS=$(gh release view V1 --repo mzereashte94/Mzere --json assets -q ".assets[].name" | grep "^${REAL_NAME}_signed_" || echo "none")
          if [[ "$OLD_ASSETS" != "none" ]]; then
            for old_asset in $OLD_ASSETS; do
              if [ -n "$old_asset" ]; then
                gh release delete-asset V1 "$old_asset" -y --repo mzereashte94/Mzere || true
              fi
            done
          fi

          echo ">> Uploading new signed IPA..."
          gh release upload V1 "$FINAL_IPA_NAME" --repo mzereashte94/Mzere || { echo "❌ ERROR: Failed to upload to release!"; exit 1; }
          
          echo "✅ SUCCESS!"
