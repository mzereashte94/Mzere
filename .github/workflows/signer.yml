name: Premium Cloud Signer Engine (Ultra Fast)

on:
  repository_dispatch:
    types: [trigger-sign]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Fast Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 1
          sparse-checkout: |
            icons
            cert

      - name: 🚀 Ultra Fast Production Sign
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          USE_FREE_CERT: ${{ github.event.client_payload.use_free_cert }}
          CERT_ID: ${{ github.event.client_payload.cert_id }}
          P12_BASE64: ${{ github.event.client_payload.p12_base64 }}
          PROV_BASE64: ${{ github.event.client_payload.prov_base64 }}
          CUSTOM_PASSWORD: ${{ github.event.client_payload.password }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          set -uo pipefail

          LOWER_APP=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$LOWER_APP" == "ashtemobile" ]]; then IPA_NAME="AshteMobile.ipa"; ICON_NAME="Ashtemobile.jpeg"; REAL_NAME="AshteMobile";
          elif [[ "$LOWER_APP" == "esign" ]]; then IPA_NAME="Esign.ipa"; ICON_NAME="Esign.jpeg"; REAL_NAME="Esign";
          elif [[ "$LOWER_APP" == "ksign" ]]; then IPA_NAME="Ksign.ipa"; ICON_NAME="Ksign.jpeg"; REAL_NAME="Ksign";
          elif [[ "$LOWER_APP" == "mytv" ]]; then IPA_NAME="MyTV.ipa"; ICON_NAME="mytv.jpeg"; REAL_NAME="MyTV";
          else IPA_NAME="AshteMobile.ipa"; ICON_NAME="Ashtemobile.jpeg"; REAL_NAME="AshteMobile"; fi

          wget -qO- https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-linux-x86_64.tar.gz | tar -xz
          chmod +x zsign
          
          gh release download V1 -p "$IPA_NAME" --repo ${{ github.repository }} || true
          if [ ! -f "$IPA_NAME" ]; then
            wget -q -O "$IPA_NAME" "https://github.com/${{ github.repository }}/releases/download/V1/$IPA_NAME" || true
          fi
          mv "$IPA_NAME" raw_app.ipa
          
          if [[ "$USE_FREE_CERT" == "true" ]]; then
            cp "$GITHUB_WORKSPACE/cert/$CERT_ID/cert.p12" ./cert.p12 || true
            cp "$GITHUB_WORKSPACE/cert/$CERT_ID/profile.mobileprovision" ./profile.mobileprovision || true
            if [ -f "$GITHUB_WORKSPACE/cert/$CERT_ID/pass.txt" ]; then
              CERT_PASSWORD=$(cat "$GITHUB_WORKSPACE/cert/$CERT_ID/pass.txt" | tr -d '\n\r')
            else
              CERT_PASSWORD=""
            fi
          else
            echo "$P12_BASE64" | tr -d ' \n\r' | base64 -d > cert.p12
            echo "$PROV_BASE64" | tr -d ' \n\r' | base64 -d > profile.mobileprovision
            CERT_PASSWORD=$(echo "$CUSTOM_PASSWORD" | tr -d '\n\r')
          fi

          # تەنها zsign بەکاردەهێنین بۆ واژۆکردن بەبێ تێکدانی فایلە بنەڕەتییەکان
          ./zsign -k cert.p12 -p "$CERT_PASSWORD" -m profile.mobileprovision -o "${REAL_NAME}_signed.ipa" raw_app.ipa
          
          if [ -f "${REAL_NAME}_signed.ipa" ]; then
            gh release upload V1 "${REAL_NAME}_signed.ipa" --clobber --repo ${{ github.repository }}
          else
            exit 1
          fi
