name: Premium Cloud Signer Engine (Ultra Fast)

on:
  repository_dispatch:
    types: [trigger-sign]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Fast Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 1
          sparse-checkout: |
            icons
            cert

      - name: 🚀 Ultra Fast Production Sign
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          USE_FREE_CERT: ${{ github.event.client_payload.use_free_cert }}
          P12_BASE64: ${{ github.event.client_payload.p12_base64 }}
          PROV_BASE64: ${{ github.event.client_payload.prov_base64 }}
          CUSTOM_PASSWORD: ${{ github.event.client_payload.password }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          set -euo pipefail

          cat << 'EOF' > /tmp/custom_openssl.cnf
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1
          EOF
          export OPENSSL_CONF=/tmp/custom_openssl.cnf
          
          # ڕێکخستنی ناوەکان بۆ ئەوەی لەگەڵ وێبسایتەکەی تۆدا سەدا سەد یەکبگرنەوە
          LOWER_APP=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$LOWER_APP" == "ashtemobile" ]]; then IPA_NAME="AshteMobile.ipa"; REAL_NAME="AshteMobile";
          elif [[ "$LOWER_APP" == "esign" ]]; then IPA_NAME="Esign.ipa"; REAL_NAME="Esign";
          elif [[ "$LOWER_APP" == "ksign" ]]; then IPA_NAME="Ksign.ipa"; REAL_NAME="Ksign";
          elif [[ "$LOWER_APP" == "mytv" ]]; then IPA_NAME="MyTV.ipa"; REAL_NAME="MyTV";
          else IPA_NAME="AshteMobile.ipa"; REAL_NAME="AshteMobile"; fi

          (
            wget -qO- https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-linux-x86_64.tar.gz | tar -xz
            chmod +x zsign
          ) &
          
          # هێنانی ئەپە خاوەکە لەناو V1 بە دروستی
          (
            gh release download V1 -p "$IPA_NAME" --repo ${{ github.repository }} > /dev/null 2>&1 || true
            mv "$IPA_NAME" raw_app.ipa || echo "App not found"
          ) &
          
          (
            if [[ "$USE_FREE_CERT" == "true" ]]; then
              cp "$GITHUB_WORKSPACE/cert/cert.p12" ./cert.p12
              cp "$GITHUB_WORKSPACE/cert/profile.mobileprovision" ./profile.mobileprovision
            else
              echo "$P12_BASE64" | tr -d ' \n\r' | base64 -d > cert.p12
              echo "$PROV_BASE64" | tr -d ' \n\r' | base64 -d > profile.mobileprovision
            fi
          ) &
          
          wait

          if [[ "$USE_FREE_CERT" == "true" ]]; then CERT_PASSWORD=$(cat "$GITHUB_WORKSPACE/cert/pass.txt" | tr -d '\n\r');
          else CERT_PASSWORD=$(echo "$CUSTOM_PASSWORD" | tr -d '\n\r'); fi

          # کردنەوەی فایلەکە بەشێوەیەکی سەلامەت بۆ دانانی بڕوانامەی پریمیەم بۆ Ksign
          unzip -q raw_app.ipa
          APP_DIR=$(find Payload -maxdepth 1 -type d -name "*.app" | head -n 1)

          if [[ "$REAL_NAME" == "Ksign" ]]; then
            mkdir -p "$APP_DIR/signing-assets/PremiumCert"
            cp cert.p12 "$APP_DIR/signing-assets/PremiumCert/cert.p12"
            cp profile.mobileprovision "$APP_DIR/signing-assets/PremiumCert/profile.mobileprovision"
            echo "$CERT_PASSWORD" > "$APP_DIR/signing-assets/PremiumCert/cert.txt"
          fi

          # سڕینەوەی پڵەگینە زیانبەخشەکان کە دەبنە هۆی وەستانی ئینستاڵ
          rm -rf "$APP_DIR/PlugIns" || true
          rm -rf "$APP_DIR/Extensions" || true
          rm -rf "$APP_DIR/Watch" || true

          rm raw_app.ipa
          zip -q0ur raw_app.ipa Payload

          # دانانی ناسنامەی پاک کە ئایفۆن قبووڵی دەکات
          NEW_BUNDLE_ID="com.ashtemobile.vip.${LOWER_APP}"

          ./zsign -q -k cert.p12 -p "$CERT_PASSWORD" -m profile.mobileprovision -b "$NEW_BUNDLE_ID" -n "$REAL_NAME" -o "${REAL_NAME}_signed.ipa" raw_app.ipa

          # ⚠️ لێرەدا کێشە گەورەکەمان چارەسەر کرد: ڕاستەوخۆ دەچێتەوە ناو V1 نەک فۆڵدەری تر
          gh release upload V1 "${REAL_NAME}_signed.ipa" --clobber --repo ${{ github.repository }}
