name: Premium Cloud Signer Engine (Ultra Fast)

on:
  repository_dispatch:
    types: [trigger-sign]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Fast Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 1
          sparse-checkout: |
            icons
            cert

      - name: 🚀 Ultra Fast Production Sign
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          USE_FREE_CERT: ${{ github.event.client_payload.use_free_cert }}
          CERT_ID: ${{ github.event.client_payload.cert_id }}
          P12_BASE64: ${{ github.event.client_payload.p12_base64 }}
          PROV_BASE64: ${{ github.event.client_payload.prov_base64 }}
          CUSTOM_PASSWORD: ${{ github.event.client_payload.password }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          set -uo pipefail

          cat << 'EOF' > /tmp/custom_openssl.cnf
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1
          EOF
          export OPENSSL_CONF=/tmp/custom_openssl.cnf
          
          LOWER_APP=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$LOWER_APP" == "ashtemobile" ]]; then IPA_NAME="AshteMobile.ipa"; ICON_NAME="Ashtemobile.jpeg"; REAL_NAME="AshteMobile";
          elif [[ "$LOWER_APP" == "esign" ]]; then IPA_NAME="Esign.ipa"; ICON_NAME="Esign.jpeg"; REAL_NAME="Esign";
          elif [[ "$LOWER_APP" == "ksign" ]]; then IPA_NAME="Ksign.ipa"; ICON_NAME="Ksign.jpeg"; REAL_NAME="Ksign";
          elif [[ "$LOWER_APP" == "mytv" ]]; then IPA_NAME="MyTV.ipa"; ICON_NAME="mytv.jpeg"; REAL_NAME="MyTV";
          else IPA_NAME="AshteMobile.ipa"; ICON_NAME="Ashtemobile.jpeg"; REAL_NAME="AshteMobile"; fi

          wget -qO- https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-linux-x86_64.tar.gz | tar -xz
          chmod +x zsign
          
          gh release download V1 -p "$IPA_NAME" --repo ${{ github.repository }} || true
          if [ ! -f "$IPA_NAME" ]; then
            wget -q -O "$IPA_NAME" "https://github.com/${{ github.repository }}/releases/download/V1/$IPA_NAME" || true
          fi
          mv "$IPA_NAME" raw_app.ipa
          
          cp "$GITHUB_WORKSPACE/icons/$ICON_NAME" downloaded_icon.png || true
          
          if [[ "$USE_FREE_CERT" == "true" ]]; then
            cp "$GITHUB_WORKSPACE/cert/$CERT_ID/cert.p12" ./cert.p12 || true
            cp "$GITHUB_WORKSPACE/cert/$CERT_ID/profile.mobileprovision" ./profile.mobileprovision || true
            if [ -f "$GITHUB_WORKSPACE/cert/$CERT_ID/pass.txt" ]; then
              CERT_PASSWORD=$(cat "$GITHUB_WORKSPACE/cert/$CERT_ID/pass.txt" | tr -d '\n\r')
            else
              CERT_PASSWORD=""
            fi
          else
            echo "$P12_BASE64" | tr -d ' \n\r' | base64 -d > cert.p12
            echo "$PROV_BASE64" | tr -d ' \n\r' | base64 -d > profile.mobileprovision
            CERT_PASSWORD=$(echo "$CUSTOM_PASSWORD" | tr -d '\n\r')
          fi

          APP_DIR=$(python3 -c "
          import zipfile
          try:
              with zipfile.ZipFile('raw_app.ipa', 'r') as z:
                  for name in z.namelist():
                      if name.startswith('Payload/') and name.endswith('.app/Info.plist'):
                          print(name.replace('Info.plist', ''))
                          break
          except:
              pass
          ")
          
          if [ -n "$APP_DIR" ]; then
            unzip -q raw_app.ipa "${APP_DIR}Info.plist" || true
            if [ -f "downloaded_icon.png" ]; then
              mv downloaded_icon.png "${APP_DIR}CustomIpaBlackIcon.png" || true
            fi

            if [[ "$REAL_NAME" == "Ksign" ]]; then
              mkdir -p "${APP_DIR}signing-assets/PremiumCert" || true
              cp cert.p12 "${APP_DIR}signing-assets/PremiumCert/cert.p12" || true
              cp profile.mobileprovision "${APP_DIR}signing-assets/PremiumCert/profile.mobileprovision" || true
              echo "$CERT_PASSWORD" > "${APP_DIR}signing-assets/PremiumCert/cert.txt" || true
            fi

            # ناسنامەیەکی جێگیر و نەگۆڕ بۆ هەریەکەیان
            UNIQUE_BUNDLE="com.ashtemobile.${LOWER_APP}.vip"

            python3 -c '
          import plistlib, sys
          app_dir, unique_bndl = sys.argv[1], sys.argv[2]
          plist_path = f"{app_dir}Info.plist"
          try:
              with open(plist_path, "rb") as f: pl = plistlib.load(f)
              pl["CFBundleIdentifier"] = unique_bndl
              pl["CFBundleIcons"] = {"CFBundlePrimaryIcon": {"CFBundleIconFiles": ["CustomIpaBlackIcon"], "UIPrerenderedIcon": True}}
              if "CFBundleIcons~ipad" in pl: pl["CFBundleIcons~ipad"] = pl["CFBundleIcons"]
              with open(plist_path, "wb") as f: plistlib.dump(pl, f)
          except Exception as e:
              pass
            ' "$APP_DIR" "$UNIQUE_BUNDLE" || true

            zip -q0ur raw_app.ipa Payload || true
          fi
          
          ./zsign -k cert.p12 -p "$CERT_PASSWORD" -m profile.mobileprovision -o "${REAL_NAME}_signed.ipa" raw_app.ipa
          
          if [ -f "${REAL_NAME}_signed.ipa" ]; then
            gh release upload V1 "${REAL_NAME}_signed.ipa" --clobber --repo ${{ github.repository }}
          else
            exit 1
          fi
